<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ReWear</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            ♻️ ReWear
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="marketplace.html">
                Marketplace
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>



    <!-- Login -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    ♻️
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue swapping.
                </p>

            </div>



            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="example@email.com"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <div class="login-options">

                    <label class="checkbox-row">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#">
                        Forgot password?
                    </a>

                </div>



                <button
                    type="submit"
                    class="auth-submit">

                    Login

                </button>



                <div
                    id="loginMessage"
                    class="form-message">
                </div>


            </form>



            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
