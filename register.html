<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | ReWear</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            ♻️ ReWear
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="marketplace.html">
                Marketplace
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- Register Section -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    ♻️
                </div>

                <h1>
                    Join ReWear
                </h1>

                <p>
                    Create an account and start swapping.
                </p>

            </div>


            <form id="registerForm">


                <!-- Name -->

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                    <small
                        id="nameError"
                        class="error-message">
                    </small>

                </div>



                <!-- Email -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@email.com"
                        required
                    >

                    <small
                        id="emailError"
                        class="error-message">
                    </small>

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                    <small
                        id="passwordError"
                        class="error-message">
                    </small>

                </div>



                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                    <small
                        id="confirmError"
                        class="error-message">
                    </small>

                </div>



                <!-- Location -->

                <div class="form-group">

                    <label for="registerLocation">
                        Location
                    </label>

                    <select id="registerLocation"
                            required>

                        <option value="">
                            Select your city
                        </option>

                        <option value="Mumbai">
                            Mumbai
                        </option>

                        <option value="Pune">
                            Pune
                        </option>

                        <option value="Nashik">
                            Nashik
                        </option>

                        <option value="Thane">
                            Thane
                        </option>

                        <option value="Bengaluru">
                            Bengaluru
                        </option>

                    </select>

                </div>



                <!-- Terms -->

                <label class="checkbox-row">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the ReWear
                        community guidelines.
                    </span>

                </label>



                <!-- Submit -->

                <button
                    type="submit"
                    class="auth-submit">

                    Create Account

                </button>


                <!-- Message -->

                <div
                    id="registerMessage"
                    class="form-message">
                </div>


            </form>



            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
