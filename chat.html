<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Swap Chat | ReWear</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>


<body>


    <!-- Navbar -->

    <header class="navbar">

        <div class="container nav-container">


            <a href="index.html"
               class="logo">

                ReWear

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="marketplace.html">
                    Marketplace
                </a>

                <a href="swap-requests.html">
                    My Swaps
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

            </nav>


            <div class="nav-actions">

                <a href="login.html"
                   class="btn btn-outline">

                    Login

                </a>

                <a href="register.html"
                   class="btn btn-primary">

                    Join ReWear

                </a>

            </div>


        </div>

    </header>



    <!-- Chat Page -->

    <main class="chat-page">


        <div class="container">


            <a href="swap-requests.html"
               class="back-link">

                ← Back to My Swaps

            </a>



            <div class="chat-layout">


                <!-- Chat Header + Messages -->

                <section class="chat-container">


                    <div id="chatHeader"
                         class="chat-header">

                        Loading...

                    </div>



                    <div id="chatMessages"
                         class="chat-messages">

                    </div>



                    <form id="chatForm"
                          class="chat-form">


                        <input
                            type="text"
                            id="messageInput"
                            placeholder="Write a message..."
                            autocomplete="off"
                            required>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Send

                        </button>


                    </form>


                </section>



                <!-- Swap Information -->

                <aside id="swapSummary"
                       class="swap-summary">

                    Loading...

                </aside>


            </div>

        </div>

    </main>



    <!-- Footer -->

    <footer class="footer">


        <div class="container footer-content">


            <div>

                <h3>ReWear</h3>

                <p>
                    Swap clothes.
                    Reduce waste.
                    Wear again.
                </p>

            </div>


            <div>

                <h4>Quick Links</h4>

                <a href="index.html">
                    Home
                </a>

                <a href="marketplace.html">
                    Marketplace
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

            </div>


        </div>


        <div class="footer-bottom">

            <p>
                © 2026 ReWear.
                Sustainable fashion through swapping.
            </p>

        </div>


    </footer>



    <script src="js/chat.js"></script>

</body>

</html>
